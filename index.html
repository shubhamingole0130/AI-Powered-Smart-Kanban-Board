<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Kanban Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Smart Kanban Board</h1>
  </header>

<!-- FILTER BAR -->
<div class="filter-bar">

  <div class="filter-group">
    <span class="filter-label">Priority:</span>
    <button class="filter-btn active" data-filter="priority" data-value="">All</button>
    <button class="filter-btn" data-filter="priority" data-value="high">High</button>
    <button class="filter-btn" data-filter="priority" data-value="medium">Medium</button>
    <button class="filter-btn" data-filter="priority" data-value="low">Low</button>
  </div>

  <div class="filter-group">
    <span class="filter-label">Label:</span>
    <button class="filter-btn active" data-filter="label" data-value="">All</button>
    <button class="filter-btn" data-filter="label" data-value="bug">Bug</button>
    <button class="filter-btn" data-filter="label" data-value="feature">Feature</button>
    <button class="filter-btn" data-filter="label" data-value="design">Design</button>
  </div>

  <div class="filter-group">
    <span class="filter-label">Assignee:</span>
    <input
      type="text"
      id="assigneeFilter"
      placeholder="Search assignee..."
      class="filter-input"
    />
  </div>

  <button class="clear-filters-btn" id="clearFilters">✕ Clear Filters</button>
<span class="filter-results" id="filterResults"></span>
</div>

<!-- main class board  -->
<div class="app-layout">

  <main class="board">
    <section class="column" id="todo">
      <h2>To Do <span class="count" id="count-todo">0</span></h2>
      <div class="cards-container" id="cards-todo"></div>
      <button class="add-btn" data-column="todo">+ Add Task</button>
    </section>

    <section class="column" id="in-progress">
      <h2>In Progress <span class="count" id="count-in-progress">0</span></h2>
      <div class="cards-container" id="cards-in-progress"></div>
      <button class="add-btn" data-column="in-progress">+ Add Task</button>
    </section>

    <section class="column" id="done">
      <h2>Done <span class="count" id="count-done">0</span></h2>
      <div class="cards-container" id="cards-done"></div>
      <button class="add-btn" data-column="done">+ Add Task</button>
    </section>
  </main>

  <!-- ACTIVITY SIDEBAR -->
  <aside class="activity-sidebar" id="activitySidebar">
    <div class="sidebar-header">
      <h3>Activity</h3>
      <button class="clear-feed-btn" id="clearFeed">Clear</button>
    </div>
    <ul class="activity-feed" id="activityFeed">
      <li class="feed-empty">No activity yet</li>
    </ul>
  </aside>

</div>
</main>
<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">

    <div class="modal-header">
    <h3 id="modalTitle">Add New Task</h3>
      <button class="close-btn" id="closeModal">&times;</button>
    </div>

    <div class="modal-body">

      <label>Title <span class="required">*</span></label>
      <input type="text" id="taskTitle" placeholder="e.g. Fix login bug" />

      <label>Description</label>
      <textarea id="taskDesc" placeholder="What needs to be done?"></textarea>

      <label>Label</label>
      <select id="taskLabel">
        <option value="feature">Feature</option>
        <option value="bug">Bug</option>
        <option value="design">Design</option>
      </select>

      <label>Assignee</label>
      <input type="text" id="taskAssignee" placeholder="e.g. Rahul" />

      <label>Priority</label>
      <select id="taskPriority">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>

    </div>

    <div class="modal-footer">
      <button class="btn-cancel" id="cancelModal">Cancel</button>
      <button class="btn-submit" id="submitTask">Add Task</button>
    </div>

  </div>
</div>

  <script src="script.js" type="module"></script>
  
</body>
</html>
