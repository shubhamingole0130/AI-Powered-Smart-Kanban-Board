<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Kanban Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Smart Kanban Board</h1>
  </header>

  <main class="board">
    <section class="column" id="todo">
      <h2>To Do</h2>
    </section>
    <section class="column" id="in-progress">
      <h2>In Progress</h2>
    </section>
    <section class="column" id="done">
      <h2>Done</h2>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
